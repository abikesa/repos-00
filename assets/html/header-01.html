<script>
(function () {
  /* Logo theme switching — kept in sync with shared.js data-theme toggle */
  function syncLogo () {
    var img   = document.getElementById('nav-logo-img');
    var theme = document.documentElement.getAttribute('data-theme');
    if (!img) return;
    img.src = theme === 'dark'
      ? 'https://abikesa.github.io/logos/assets/ukubona-dark.png'
      : 'https://abikesa.github.io/logos/assets/ukubona-light.png';
  }
  syncLogo();

  /* Watch for data-theme changes (set by shared.js) */
  var mo = new MutationObserver(syncLogo);
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* Theme button — shared.js may also wire this up; we're safe to duplicate */
  var themeBtn = document.getElementById('toggle-theme');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var html  = document.documentElement;
      var dark  = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', dark ? 'light' : 'dark');
      themeBtn.textContent = dark ? '☀️' : '🌙';
    });
  }

  /* App grid overlay */
  var overlay   = document.getElementById('app-grid-overlay');
  var openBtn   = document.getElementById('nav-apps-btn');
  var closeBtn  = document.getElementById('app-overlay-close');

  if (overlay && openBtn) {
    openBtn.addEventListener('click', function () {
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
    });
    closeBtn.addEventListener('click', function () {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
    });
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
      }
    });
  }

  /* Active nav link highlighting */
  var links = document.querySelectorAll('.nav-link[data-nav]');
  function markActive () {
    var path = window.location.pathname;
    var hash = window.location.hash.replace('#', '');
    links.forEach(function (a) {
      var nav = a.getAttribute('data-nav');
      a.classList.toggle('active',
        (hash && nav === hash) ||
        (!hash && nav === 'home' && (path === '/' || path.endsWith('index.html')))
      );
    });
  }
  markActive();
  window.addEventListener('hashchange', markActive, { passive: true });
}());
</script>
